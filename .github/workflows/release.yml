name: Release

# Manually triggered. Builds and tests the commit, publishes the NuGet packages to nuget.org and
# creates a GitHub release with generated release notes.
#
# The major and minor version are defined by VersionMajorMinor in Directory.Build.props. The patch
# version is the highest patch of existing tags of that major.minor plus one (.github/scripts/next-version.sh).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test and pack, but don't create a tag, publish packages or create a release
        type: boolean
        default: false

# Two releases at the same time would pick the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    # Releases are made only from develop.
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Create the tag and the release
      id-token: write   # Get a short-lived nuget.org API key with trusted publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # All tags are needed to find the next patch version.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        run: |
          version="$(.github/scripts/next-version.sh)"
          echo "version=$version" >> "$GITHUB_ENV"
          echo "Releasing $version" >> "$GITHUB_STEP_SUMMARY"
          echo "Releasing $version"

      - name: Check that nuget.org does not have the version
        # nuget.org refuses a version that it already has. The check stops the workflow before it creates the tag.
        # The flat container returns 404 when the package ID does not exist yet. This is the case for the first release.
        run: |
          for id in bitbindle.closedxml bitbindle.closedxml.io; do
            url="https://api.nuget.org/v3-flatcontainer/$id/index.json"
            status="$(curl --silent --show-error --output versions.json --write-out '%{http_code}' "$url")"
            if [[ "$status" == 200 ]]; then
              if jq --exit-status --arg v "${version,,}" '.versions | index($v)' versions.json > /dev/null; then
                echo "::error::nuget.org already has $id $version. Change VersionMajorMinor or VersionSuffix in Directory.Build.props."
                exit 1
              fi
            elif [[ "$status" != 404 ]]; then
              echo "::error::nuget.org returned HTTP $status for $url"
              exit 1
            fi
          done

      - name: Restore dependencies
        run: dotnet restore ClosedXML.slnx

      - name: Build
        # VersionPrefix is major.minor.patch, the suffix comes from Directory.Build.props. The
        # workflow sets RepositoryUrl to its own repository, so that the packages link to that repository.
        run: >
          dotnet build ClosedXML.slnx --configuration Release --no-restore
          -p:VersionPrefix="${version%%-*}"
          -p:RepositoryUrl="${{ github.server_url }}/${{ github.repository }}"

      - name: Test
        run: >
          dotnet test ClosedXML.Tests/ClosedXML.Tests.csproj
          --configuration Release --no-build --framework net10.0
          --filter "TestCategory!=OLEDB"

      - name: Pack
        # ClosedXML depends on ClosedXML.IO, so both packages are needed.
        run: |
          for project in ClosedXML.IO/ClosedXML.IO.csproj ClosedXML/ClosedXML.csproj; do
            dotnet pack "$project" --configuration Release --no-build --output artifacts \
              -p:VersionPrefix="${version%%-*}" \
              -p:RepositoryUrl="${{ github.server_url }}/${{ github.repository }}"
          done

      - name: Check packages
        run: |
          ls -l artifacts
          for id in BitBindle.ClosedXML BitBindle.ClosedXML.IO; do
            [[ -f "artifacts/$id.$version.nupkg" ]] || { echo "::error::Package $id.$version.nupkg is missing"; exit 1; }
          done

      - name: Create tag
        # The tag claims the version. If a later step fails, the version is not reused by the next release.
        if: ${{ !inputs.dry_run }}
        run: |
          git tag "$version" "$GITHUB_SHA"
          git push origin "refs/tags/$version"

      - name: Log in to nuget.org
        # Trusted publishing. The action exchanges the OIDC token of the workflow for a short-lived API key.
        # The secret NUGET_USER holds the nuget.org user name (not the e-mail address) of the policy owner.
        if: ${{ !inputs.dry_run }}
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        # The packages contain the pdb, so the workflow does not push the .snupkg symbol packages
        # (see the comment about the checksum in Directory.Build.props).
        if: ${{ !inputs.dry_run }}
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "$NUGET_API_KEY"
          --no-symbols

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$version" == *-* ]] && prerelease=(--prerelease)
          gh release create "$version" artifacts/*.nupkg \
            --verify-tag --title "$version" --generate-notes "${prerelease[@]}"
